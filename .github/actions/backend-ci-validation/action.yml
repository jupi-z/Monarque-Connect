name: Backend CI validation
description: Run the shared Monarque Connect database, test, migration and build gates.
inputs:
  ci-resource-suffix:
    description: Unique suffix derived from GitHub run ID and attempt
    required: true
  repeat-targeted-stability:
    description: Repeat CRM and Phase 1 regression suites on hosted CI
    required: false
    default: 'false'
runs:
  using: composite
  steps:
    - name: Start per-run isolated PostgreSQL
      shell: bash
      run: |
        CONTAINER_NAME="monarque-ci-postgres-${{ inputs.ci-resource-suffix }}"
        docker run -d --name "$CONTAINER_NAME" \
          -e POSTGRES_USER=postgres \
          -e POSTGRES_PASSWORD=postgres \
          -e POSTGRES_DB=monarque_connect_test \
          -p 127.0.0.1::5432 \
          --health-cmd='pg_isready -U postgres' \
          --health-interval=10s \
          --health-timeout=5s \
          --health-retries=5 \
          postgres:17
        HOST_PORT="$(docker port "$CONTAINER_NAME" 5432/tcp | head -n 1 | sed -E 's/.*:([0-9]+)$/\1/')"
        if [[ ! "$HOST_PORT" =~ ^[0-9]+$ ]]; then
          docker logs "$CONTAINER_NAME"
          echo "Could not determine the isolated PostgreSQL host port" >&2
          exit 1
        fi
        echo "DATABASE_URL=postgresql://postgres:postgres@${DATABASE_HOST}:${HOST_PORT}/monarque_connect_test" >> "$GITHUB_ENV"
        echo "TEST_DATABASE_URL=postgresql://postgres:postgres@${DATABASE_HOST}:${HOST_PORT}/monarque_connect_test" >> "$GITHUB_ENV"
        for i in $(seq 1 30); do
          if docker inspect --format '{{.State.Health.Status}}' "$CONTAINER_NAME" | grep -q healthy; then
            exit 0
          fi
          sleep 2
        done
        docker logs "$CONTAINER_NAME"
        exit 1
    - name: Install dependencies
      shell: bash
      run: npm ci
    - shell: bash
      run: npm run prisma:generate
    - name: Audit runtime dependency graph
      shell: bash
      run: |
        npm audit --json > /tmp/npm-audit.json || true
        node scripts/check-runtime-audit.mjs /tmp/npm-audit.json
    - shell: bash
      run: npm run lint
    - shell: bash
      run: npm run typecheck
    - shell: bash
      run: npm run prisma:validate
    - name: Verify empty-database and Phase 1 upgrade migrations
      shell: bash
      run: npm run prisma:phase2:migration-proof
    - name: Verify empty-database and Phase 2 upgrade migrations
      shell: bash
      run: npm run prisma:phase3:migration-proof
    - name: Verify empty-database and Phase 4 upgrade migrations
      shell: bash
      run: npm run prisma:phase5:migration-proof
    - name: Verify empty-database and Phase 5 upgrade migrations
      shell: bash
      run: npm run prisma:phase6:migration-proof
    - name: Verify empty-database and Phase 6 upgrade migrations
      shell: bash
      run: npm run prisma:phase7:migration-proof
    - name: Verify empty-database and Phase 7 upgrade migrations
      shell: bash
      run: npm run prisma:phase8:migration-proof
    - name: Verify empty-database and Phase 9 / Phase 9.5 upgrade migrations
      if: ${{ hashFiles('scripts/verify-phase9-migrations.mjs') != '' }}
      shell: bash
      run: npm run prisma:phase9:migration-proof
    - name: Verify empty-database and Phase 9.6 upgrade migrations
      if: ${{ hashFiles('scripts/verify-phase96-migrations.mjs') != '' }}
      shell: bash
      run: npm run prisma:phase96:migration-proof
    - name: Verify empty-database and Phase 9.6 upgrade migrations for Phase 10A
      if: ${{ hashFiles('scripts/verify-phase10a-migrations.mjs') != '' }}
      shell: bash
      run: npm run prisma:phase10a:migration-proof
    - shell: bash
      run: npm run prisma:deploy
    - shell: bash
      run: npm run openapi:validate
    - shell: bash
      run: npm run contracts:validate
    - name: Run database-free unit tests
      shell: bash
      run: env -u DATABASE_URL -u TEST_DATABASE_URL npm run test:unit -- --pool=forks --maxWorkers=1 --no-file-parallelism --testTimeout=30000 --hookTimeout=60000
    - name: Run PostgreSQL integration tests
      shell: bash
      run: npm run test:integration -- --pool=forks --maxWorkers=1 --no-file-parallelism --testTimeout=30000 --hookTimeout=60000
    - name: Prepare isolated HTTP E2E database
      shell: bash
      run: |
        CONTAINER_NAME="monarque-ci-postgres-${{ inputs.ci-resource-suffix }}"
        docker exec "$CONTAINER_NAME" createdb -U postgres monarque_connect_test_e2e
        E2E_DATABASE_URL="$(node -e 'const url = new URL(process.env.DATABASE_URL); url.pathname = "/monarque_connect_test_e2e"; process.stdout.write(url.toString())')"
        DATABASE_URL="$E2E_DATABASE_URL" npm run prisma:deploy
        echo "DATABASE_URL=$E2E_DATABASE_URL" >> "$GITHUB_ENV"
        echo "TEST_DATABASE_URL=$E2E_DATABASE_URL" >> "$GITHUB_ENV"
    - name: Run HTTP E2E suite once on its isolated database
      shell: bash
      run: npm run test:e2e -- --pool=forks --maxWorkers=1 --no-file-parallelism --testTimeout=30000
    - name: Repeat CRM and Phase 1 regressions ten times in both orders
      if: ${{ inputs.repeat-targeted-stability == 'true' }}
      shell: bash
      run: |
        set -euo pipefail
        for iteration in $(seq 1 10); do
          echo "=== isolated regression iteration ${iteration}/10 ==="
          if (( iteration % 2 == 1 )); then
            npm run test:integration -- tests/crm/leads-opportunities.integration.test.ts --pool=forks --maxWorkers=1 --no-file-parallelism --testTimeout=30000 --hookTimeout=60000
            npm run test:e2e -- tests/e2e/phase1-http.e2e.test.ts --pool=forks --maxWorkers=1 --no-file-parallelism --testTimeout=30000
          else
            npm run test:e2e -- tests/e2e/phase1-http.e2e.test.ts --pool=forks --maxWorkers=1 --no-file-parallelism --testTimeout=30000
            npm run test:integration -- tests/crm/leads-opportunities.integration.test.ts --pool=forks --maxWorkers=1 --no-file-parallelism --testTimeout=30000 --hookTimeout=60000
          fi
        done
    - shell: bash
      run: npm run build
    - name: Smoke HTTP health endpoints
      shell: bash
      run: |
        APP_PORT="$(node -e "const net=require('node:net'); const server=net.createServer(); server.listen(0, '127.0.0.1', () => { process.stdout.write(String(server.address().port)); server.close(); });")"
        export PORT="$APP_PORT"
        openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:2048 -out /tmp/monarque-jwt-private.pem
        openssl rsa -pubout -in /tmp/monarque-jwt-private.pem -out /tmp/monarque-jwt-public.pem
        export JWT_ISSUER=monarque-connect-ci
        export JWT_AUDIENCE=monarque-connect-api-ci
        export JWT_KEY_ID=ci-ephemeral-key-1
        export JWT_PRIVATE_KEY_PEM="$(cat /tmp/monarque-jwt-private.pem)"
        export JWT_PUBLIC_KEY_PEM="$(cat /tmp/monarque-jwt-public.pem)"
        npm run start > /tmp/monarque-connect.log 2>&1 &
        APP_PID=$!
        trap 'kill "$APP_PID" 2>/dev/null || true' EXIT
        for i in $(seq 1 20); do
          if curl -fsS "http://127.0.0.1:${APP_PORT}/api/v1/health/live" > /dev/null; then
            break
          fi
          sleep 1
        done
        curl -fsS "http://127.0.0.1:${APP_PORT}/api/v1/health/live"
        curl -fsS "http://127.0.0.1:${APP_PORT}/api/v1/health/ready"
    - name: Cleanup isolated PostgreSQL
      if: always()
      shell: bash
      run: docker rm -f "monarque-ci-postgres-${{ inputs.ci-resource-suffix }}" >/dev/null 2>&1 || true
