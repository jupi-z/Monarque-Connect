name: Backend CI hosted reusable

on:
  workflow_call:
    inputs:
      ref:
        description: Git ref to validate
        required: true
        type: string

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      NODE_ENV: test
      PORT: 3000
      CI_RESOURCE_SUFFIX: ${{ github.run_id }}-${{ github.run_attempt }}
      DATABASE_HOST: 127.0.0.1

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Run shared CI validation
        uses: ./.github/actions/backend-ci-validation
        with:
          ci-resource-suffix: ${{ env.CI_RESOURCE_SUFFIX }}
          repeat-targeted-stability: 'true'
