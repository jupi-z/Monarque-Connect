name: Backend CI reusable

on:
  workflow_call:
    inputs:
      runner:
        description: JSON array of runner labels
        required: true
        type: string
      ref:
        description: Git ref to validate
        required: true
        type: string
      database-url:
        description: External test database URL; empty starts an isolated local PostgreSQL container
        required: false
        default: ''
        type: string

permissions:
  contents: read

jobs:
  validate:
    runs-on: ${{ fromJSON(inputs.runner) }}
    env:
      NODE_ENV: test
      PORT: 3000
      DATABASE_URL: ${{ inputs.database-url != '' && inputs.database-url || 'postgresql://postgres:postgres@127.0.0.1:55432/monarque_connect_test' }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Start isolated PostgreSQL when no external database is supplied
        if: ${{ inputs.database-url == '' }}
        run: |
          docker rm -f monarque-ci-postgres >/dev/null 2>&1 || true
          docker run -d --name monarque-ci-postgres \
            -e POSTGRES_USER=postgres \
            -e POSTGRES_PASSWORD=postgres \
            -e POSTGRES_DB=monarque_connect_test \
            -p 55432:5432 \
            --health-cmd='pg_isready -U postgres' \
            --health-interval=10s \
            --health-timeout=5s \
            --health-retries=5 \
            postgres:17
          for i in $(seq 1 30); do
            if docker inspect --format '{{.State.Health.Status}}' monarque-ci-postgres | grep -q healthy; then
              exit 0
            fi
            sleep 2
          done
          docker logs monarque-ci-postgres
          exit 1
      - name: Install dependencies
        run: npm ci
      - name: Verify external PostgreSQL when supplied
        if: ${{ inputs.database-url != '' }}
        run: |
          node -e "const {Client}=require('pg'); const c=new Client({connectionString:process.env.DATABASE_URL}); c.connect().then(()=>c.query('select 1')).then(()=>c.end()).catch(e=>{console.error(e); process.exit(1)})"
      - run: npm run prisma:generate
      - name: Audit runtime dependency graph
        run: |
          npm audit --json > /tmp/npm-audit.json || true
          node scripts/check-runtime-audit.mjs /tmp/npm-audit.json
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run prisma:validate
      - name: Verify empty-database and Phase 1 upgrade migrations
        run: npm run prisma:phase2:migration-proof
      - name: Verify empty-database and Phase 2 upgrade migrations
        run: npm run prisma:phase3:migration-proof
      - name: Verify empty-database and Phase 4 upgrade migrations
        run: npm run prisma:phase5:migration-proof
      - name: Verify empty-database and Phase 5 upgrade migrations
        run: npm run prisma:phase6:migration-proof
      - name: Verify empty-database and Phase 6 upgrade migrations
        run: npm run prisma:phase7:migration-proof
      - name: Verify empty-database and Phase 7 upgrade migrations
        run: npm run prisma:phase8:migration-proof
      - name: Verify empty-database and Phase 8 upgrade migrations
        if: ${{ hashFiles('scripts/verify-phase9-migrations.mjs') != '' }}
        run: npm run prisma:phase9:migration-proof
      - run: npm run prisma:deploy
      - run: npm run openapi:validate
      - run: npm run contracts:validate
      - run: npm test -- --pool=forks --maxWorkers=1 --no-file-parallelism --testTimeout=30000 --hookTimeout=60000
      - name: Run HTTP E2E suite
        run: npm run test:e2e -- --pool=forks --maxWorkers=1 --no-file-parallelism --testTimeout=30000 --hookTimeout=60000
      - run: npm run build
      - name: Smoke HTTP health endpoints
        run: |
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:2048 -out /tmp/monarque-jwt-private.pem
          openssl rsa -pubout -in /tmp/monarque-jwt-private.pem -out /tmp/monarque-jwt-public.pem
          export JWT_ISSUER=monarque-connect-ci
          export JWT_AUDIENCE=monarque-connect-api-ci
          export JWT_KEY_ID=ci-ephemeral-key-1
          export JWT_PRIVATE_KEY_PEM="$(cat /tmp/monarque-jwt-private.pem)"
          export JWT_PUBLIC_KEY_PEM="$(cat /tmp/monarque-jwt-public.pem)"
          npm run start > /tmp/monarque-connect.log 2>&1 &
          APP_PID=$!
          trap 'kill $APP_PID 2>/dev/null || true' EXIT
          for i in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:3000/api/v1/health/live > /dev/null; then
              break
            fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:3000/api/v1/health/live
          curl -fsS http://127.0.0.1:3000/api/v1/health/ready
      - name: Cleanup isolated PostgreSQL
        if: ${{ always() && inputs.database-url == '' }}
        run: docker rm -f monarque-ci-postgres >/dev/null 2>&1 || true
