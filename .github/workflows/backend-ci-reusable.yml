name: Backend CI self-hosted reusable

on:
  workflow_call:
    inputs:
      runner:
        description: JSON array of runner labels
        required: true
        type: string
      ref:
        description: Git ref to validate
        required: true
        type: string

permissions:
  contents: read

jobs:
  validate:
    runs-on: ${{ fromJSON(inputs.runner) }}
    env:
      NODE_ENV: test
      PORT: 3000
      CI_RESOURCE_SUFFIX: ${{ github.run_id }}-${{ github.run_attempt }}
      DATABASE_HOST: 127.0.0.1

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - name: Verify preinstalled self-hosted Node.js runtime
        run: |
          node --version
          node -e "if (process.versions.node.split('.')[0] !== '24') throw new Error('Self-hosted CI runner requires Node.js 24');"
          npm --version
      - name: Run shared CI validation
        uses: ./.github/actions/backend-ci-validation
        with:
          ci-resource-suffix: ${{ env.CI_RESOURCE_SUFFIX }}
