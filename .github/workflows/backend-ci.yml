name: Backend CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      NODE_ENV: test
      PORT: 3000
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/monarque_connect_test

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: monarque_connect_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Audit runtime dependency graph
        run: |
          npm audit --json > /tmp/npm-audit.json || true
          node scripts/check-runtime-audit.mjs /tmp/npm-audit.json
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run prisma:validate
      - run: npm run prisma:generate
      - run: npm run prisma:deploy
      - run: npm run openapi:validate
      - run: npm run contracts:validate
      - run: npm test
      - run: npm run build
      - name: Smoke HTTP health endpoints
        run: |
          npm run start > /tmp/monarque-connect.log 2>&1 &
          APP_PID=$!
          trap 'kill $APP_PID 2>/dev/null || true' EXIT
          for i in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:3000/api/v1/health/live > /dev/null; then
              break
            fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:3000/api/v1/health/live
          curl -fsS http://127.0.0.1:3000/api/v1/health/ready
