name: Backend CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-pr:
    if: github.event_name == 'pull_request'
    uses: ./.github/workflows/backend-ci-hosted-reusable.yml
    with:
      ref: refs/pull/${{ github.event.pull_request.number }}/merge

  validate-main:
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/backend-ci-hosted-reusable.yml
    with:
      ref: ${{ github.sha }}
