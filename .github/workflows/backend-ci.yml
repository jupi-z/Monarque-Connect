name: Backend CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate-pr:
    if: github.event_name == 'pull_request'
    uses: ./.github/workflows/backend-ci-reusable.yml
    with:
      runner: '["ubuntu-latest"]'
      ref: refs/pull/${{ github.event.pull_request.number }}/merge

  validate-main:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    uses: ./.github/workflows/backend-ci-reusable.yml
    with:
      runner: '["self-hosted", "linux", "x64", "monarque-ci"]'
      ref: ${{ github.sha }}
