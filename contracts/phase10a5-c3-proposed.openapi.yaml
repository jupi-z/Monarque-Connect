openapi: 3.1.0
info:
  title: Monarque Connect C3 Catalog and Pricing Contract
  version: 0.1.0-proposed
  description: >-
    Normative contract for Phase 10A.5 C3. Operations marked implemented are
    present in runtime OpenAPI; the remaining operations are planned.
  x-contract-status: partially-implemented
servers:
  - url: /api/v1
security:
  - bearerAuth: []
tags:
  - name: Catalog
  - name: Pricing
  - name: Platform FX
paths:
  /catalog/measure-units:
    get:
      tags: [Catalog]
      operationId: listMeasureUnits
      responses:
        '200':
          description: Read-only, versioned measure unit registry.
          content:
            application/json:
              schema:
                type: object
                required: [version, items]
                properties:
                  version: { type: string }
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/MeasureUnit' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /catalog/currencies:
    get:
      tags: [Catalog]
      operationId: listCurrencies
      responses:
        '200':
          description: Allowlisted currency metadata; no organization defaults are changed.
          content:
            application/json:
              schema:
                type: object
                required: [version, items]
                properties:
                  version: { type: string }
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/CurrencyDefinition' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /organizations/{organizationId}/catalog/offers:
    parameters:
      - $ref: '#/components/parameters/OrganizationId'
    get:
      tags: [Catalog]
      operationId: listCommercialOffers
      x-required-principal: STAFF
      x-required-permissions: [catalog:read]
      x-product-entitlement-required: true
      parameters:
        - $ref: '#/components/parameters/ProductCode'
        - name: establishmentId
          in: query
          schema: { type: string, format: uuid }
        - name: cursor
          in: query
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
      responses:
        '200':
          description: Offers visible in the authorized tenant, product and establishment scope.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OfferPage' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [Catalog]
      operationId: createCommercialOffer
      x-required-principal: STAFF
      x-required-permissions: [catalog:write]
      x-product-entitlement-required: true
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateCommercialOffer' }
      responses:
        '201':
          description: Offer created; price is not set by this command.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CommercialOffer' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /organizations/{organizationId}/catalog/offers/{offerId}:
    parameters:
      - $ref: '#/components/parameters/OrganizationId'
      - name: offerId
        in: path
        required: true
        schema: { type: string, format: uuid }
    patch:
      tags: [Catalog]
      operationId: updateCommercialOffer
      x-required-principal: STAFF
      x-required-permissions: [catalog:write]
      x-product-entitlement-required: true
      description: Product scope is derived from the tenant-scoped offer; the client cannot change its product.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateCommercialOffer' }
      responses:
        '200':
          description: Metadata/status transition only; published prices are unchanged.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CommercialOffer' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /organizations/{organizationId}/catalog/offers/{offerId}/price-versions:
    parameters:
      - $ref: '#/components/parameters/OrganizationId'
      - name: offerId
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      tags: [Catalog]
      operationId: publishCommercialPriceVersion
      x-required-principal: STAFF
      x-required-permissions: [pricing:price:publish]
      x-product-entitlement-required: true
      description: Product scope is derived from the tenant-scoped offer; the client cannot change its product.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateCommercialPriceVersion' }
      responses:
        '201':
          description: Immutable price version published for future/current server time.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CommercialPriceVersion' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /organizations/{organizationId}/pricing/policy-versions:
    parameters:
      - $ref: '#/components/parameters/OrganizationId'
    post:
      tags: [Pricing]
      operationId: createPricingPolicyVersion
      x-runtime-status: implemented
      x-required-principal: STAFF
      x-required-roles: [OWNER, ADMIN]
      x-required-permissions: [pricing:policy:manage]
      x-product-entitlement-required: true
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreatePricingPolicyVersion' }
      responses:
        '201':
          description: New immutable pricing policy version.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PricingPolicyVersion' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /organizations/{organizationId}/pricing/discount-rule-versions:
    parameters:
      - $ref: '#/components/parameters/OrganizationId'
    post:
      tags: [Pricing]
      operationId: createCommercialDiscountRuleVersion
      x-runtime-status: implemented
      x-required-principal: STAFF
      x-required-roles: [OWNER, ADMIN]
      x-required-permissions: [pricing:policy:manage]
      x-product-entitlement-required: true
      description: Creates an immutable tenant/product-scoped percentage discount rule version. The configuration reference is provenance, not legal or promotional approval.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateCommercialDiscountRuleVersion' }
      responses:
        '201':
          description: Immutable percentage discount rule version created or exactly replayed.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CommercialDiscountRuleVersion' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /organizations/{organizationId}/pricing/quotes:
    parameters:
      - $ref: '#/components/parameters/OrganizationId'
    post:
      tags: [Pricing]
      operationId: createPricingQuote
      x-runtime-status: implemented
      x-required-principal: STAFF
      x-required-permissions: [pricing:quote:create]
      x-product-entitlement-required: true
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreatePricingQuote' }
      responses:
        '201':
          description: Deterministic immutable quote snapshot; no sale or ledger entry is created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PricingQuoteSnapshot' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /organizations/{organizationId}/pricing/quotes/{quoteId}:
    parameters:
      - $ref: '#/components/parameters/OrganizationId'
      - name: quoteId
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [Pricing]
      operationId: getPricingQuote
      x-runtime-status: implemented
      x-required-principal: STAFF
      x-required-permissions: [pricing:quote:read]
      x-product-entitlement-required: true
      parameters:
        - $ref: '#/components/parameters/ProductCode'
      responses:
        '200':
          description: The original immutable snapshot and a current validity marker.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PricingQuoteSnapshot' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /organizations/{organizationId}/catalog/items/{itemId}/variants:
    parameters:
      - $ref: '#/components/parameters/OrganizationId'
      - name: itemId
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      tags: [Catalog]
      operationId: createItemVariant
      x-required-principal: STAFF
      x-required-permissions: [catalog:write]
      x-product-entitlement-required: true
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateItemVariant' }
      responses:
        '201':
          description: Variant created under the tenant-scoped canonical Item.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ItemVariant' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /organizations/{organizationId}/pricing/tax-policy-versions:
    parameters:
      - $ref: '#/components/parameters/OrganizationId'
    post:
      tags: [Pricing]
      operationId: createTaxPolicyVersion
      x-runtime-status: implemented
      x-required-principal: STAFF
      x-required-roles: [OWNER, ADMIN]
      x-required-permissions: [pricing:tax:manage]
      x-product-entitlement-required: true
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateTaxPolicyVersion' }
      responses:
        '201':
          description: Draft technical tax configuration; not a legal certification.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TaxPolicyVersion' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /organizations/{organizationId}/pricing/tax-policy-versions/{taxPolicyVersionId}/activate:
    parameters:
      - $ref: '#/components/parameters/OrganizationId'
      - name: taxPolicyVersionId
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      tags: [Pricing]
      operationId: activateTaxPolicyVersion
      x-runtime-status: implemented
      x-required-principal: STAFF
      x-required-roles: [OWNER, ADMIN]
      x-required-permissions: [pricing:tax:manage]
      x-product-entitlement-required: true
      parameters:
        - $ref: '#/components/parameters/ProductCode'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ActivateTaxPolicyVersion' }
      responses:
        '200':
          description: Explicit activation of a tenant-configured technical rule; no legal status is implied.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TaxPolicyVersion' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /organizations/{organizationId}/pricing/tax-context-versions:
    parameters:
      - $ref: '#/components/parameters/OrganizationId'
    post:
      tags: [Pricing]
      operationId: createPricingTaxContextVersion
      x-runtime-status: implemented
      x-required-principal: STAFF
      x-required-roles: [OWNER, ADMIN]
      x-required-permissions: [pricing:tax:manage]
      x-product-entitlement-required: true
      description: Creates an immutable, tenant-configured technical jurisdiction context in DRAFT. The jurisdiction is not inferred from address and no legal certification is implied.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreatePricingTaxContextVersion' }
      responses:
        '201':
          description: Draft created or exactly replayed.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PricingTaxContextVersion' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /organizations/{organizationId}/pricing/tax-context-versions/{pricingTaxContextVersionId}/activate:
    parameters:
      - $ref: '#/components/parameters/OrganizationId'
      - name: pricingTaxContextVersionId
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      tags: [Pricing]
      operationId: activatePricingTaxContextVersion
      x-runtime-status: implemented
      x-required-principal: STAFF
      x-required-roles: [OWNER, ADMIN]
      x-required-permissions: [pricing:tax:manage]
      x-product-entitlement-required: true
      description: Activates a tenant-reviewed technical context; no legal certification is implied.
      parameters:
        - $ref: '#/components/parameters/ProductCode'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ActivatePricingTaxContextVersion' }
      responses:
        '200':
          description: Context activated or exactly replayed.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PricingTaxContextVersion' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /organizations/{organizationId}/catalog/offers/{offerId}/tax-classification:
    parameters:
      - $ref: '#/components/parameters/OrganizationId'
      - name: offerId
        in: path
        required: true
        schema: { type: string, format: uuid }
    put:
      tags: [Catalog]
      operationId: classifyCommercialOfferTax
      x-runtime-status: implemented
      x-required-principal: STAFF
      x-required-roles: [OWNER, ADMIN]
      x-required-permissions: [pricing:tax:manage]
      x-product-entitlement-required: true
      x-tenant-scoped-resource: CommercialOffer
      x-establishment-scope-derived-from-resource: true
      description: Sets or clears an explicit technical category on an offer. No category is inferred and no legal classification is implied.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ClassifyCommercialOfferTax' }
      responses:
        '200':
          description: Classification updated or exactly replayed.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CommercialOffer' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /platform/pricing/fx-rates:
    post:
      tags: [Platform FX]
      operationId: ingestFxRate
      x-required-principal: PLATFORM
      x-required-permissions: [pricing:fx:ingest]
      x-required-platform-capability: pricing:fx:ingest
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/IngestFxRate' }
      responses:
        '201':
          description: Approved-source rate recorded with provenance.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FxRate' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    OrganizationId:
      name: organizationId
      in: path
      required: true
      schema: { type: string, format: uuid }
    ProductCode:
      name: productCode
      in: query
      required: true
      schema: { type: string, pattern: '^[A-Z][A-Z0-9_]{1,63}$' }
      description: Untrusted selector; the server validates it against the controlled product registry and actor entitlement. Initial codes are MONARQUE_CONNECT and ZAMUREK; future registered products do not require a second product enum.
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: { type: string, minLength: 16, maxLength: 200 }
  responses:
    BadRequest:
      description: Invalid decimal, unit, scope selector, or request shape.
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
    Unauthorized:
      description: Authentication is required.
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
    Forbidden:
      description: Permission, entitlement, or establishment scope is denied.
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
    NotFound:
      description: Resource does not exist in the authorized scope.
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
    Conflict:
      description: Idempotency payload divergence, stale expected version, or concurrent version conflict.
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
    Unprocessable:
      description: No valid current price, policy, tax policy, or FX rate is available.
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
  schemas:
    PositivePriceAmountString:
      type: string
      maxLength: 25
      pattern: '^(?=.*[1-9])(?:0|[1-9][0-9]{0,15})(?:\.[0-9]{1,8})?$'
      description: Positive decimal amount with at most 16 integer and 8 fractional digits, matching NUMERIC(24,8).
    PositiveQuantityString:
      type: string
      maxLength: 25
      pattern: '^(?=.*[1-9])(?:0|[1-9][0-9]{0,11})(?:\.[0-9]{1,12})?$'
      description: Positive decimal quantity with at most 12 integer and 12 fractional digits, matching NUMERIC(24,12).
    PositiveFxRateString:
      type: string
      maxLength: 25
      pattern: '^(?=.*[1-9])(?:0|[1-9][0-9]{0,5})(?:\.[0-9]{1,18})?$'
      description: Positive decimal FX rate with at most 6 integer and 18 fractional digits, matching NUMERIC(24,18).
    NonNegativeAmountString:
      type: string
      maxLength: 66
      pattern: '^(?:0|[1-9][0-9]{0,46})(?:\.[0-9]{1,18})?$'
      description: Non-negative amount with at most 47 integer and 18 fractional digits.
    NonNegativeRateString:
      type: string
      maxLength: 25
      pattern: '^(?:0|[1-9][0-9]{0,5})(?:\.[0-9]{1,18})?$'
      description: Non-negative rate with at most 6 integer and 18 fractional digits.
    Problem:
      type: object
      required: [type, title, status, detail]
      properties:
        type: { type: string, format: uri-reference }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        instance: { type: string, format: uri-reference }
      additionalProperties: true
    MeasureUnit:
      type: object
      required: [code, dimension, baseUnitCode, numerator, denominator, registryVersion]
      properties:
        code: { type: string }
        dimension: { type: string }
        baseUnitCode: { type: string }
        numerator: { type: string, pattern: '^[1-9][0-9]{0,17}$' }
        denominator: { type: string, pattern: '^[1-9][0-9]{0,17}$' }
        registryVersion: { type: string }
    CurrencyDefinition:
      type: object
      required: [code, minorUnitDigits, sourceRevision]
      properties:
        code: { type: string, pattern: '^[A-Z]{3}$' }
        minorUnitDigits: { type: integer, minimum: 0, maximum: 4 }
        sourceRevision: { type: string }
    CommercialOffer:
      type: object
      required: [id, organizationId, productCode, itemId, sellUnitCode, taxCategoryCode, status, version]
      properties:
        id: { type: string, format: uuid }
        organizationId: { type: string, format: uuid }
        productCode: { type: string, pattern: '^[A-Z][A-Z0-9_]{1,63}$' }
        itemId: { type: string, format: uuid }
        variantId: { type: [string, 'null'], format: uuid }
        establishmentId: { type: [string, 'null'], format: uuid }
        channelCode: { type: [string, 'null'] }
        sellUnitCode: { type: string }
        displayName: { type: [string, 'null'] }
        taxCategoryCode: { type: [string, 'null'], pattern: '^[A-Z][A-Z0-9._-]{0,63}$', maxLength: 64, description: Explicit tenant technical classification; not inferred and not a legal certification. }
        status: { type: string, enum: [ACTIVE, INACTIVE] }
        version: { type: integer, minimum: 1 }
    OfferPage:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/CommercialOffer' } }
        nextCursor: { type: [string, 'null'] }
    CreateCommercialOffer:
      type: object
      required: [productCode, itemId, sellUnitCode]
      properties:
        productCode: { type: string, pattern: '^[A-Z][A-Z0-9_]{1,63}$' }
        itemId: { type: string, format: uuid }
        variantId: { type: string, format: uuid }
        establishmentId: { type: string, format: uuid }
        channelCode: { type: string, minLength: 1, maxLength: 48, pattern: '^[A-Za-z][A-Za-z0-9_]{0,47}$' }
        sellUnitCode: { type: string }
        displayName: { type: string, maxLength: 160 }
      additionalProperties: false
    CreateItemVariant:
      type: object
      required: [productCode, code]
      properties:
        productCode: { type: string, pattern: '^[A-Z][A-Z0-9_]{1,63}$' }
