      type: object
      additionalProperties: false
      required: [effectiveAt]
      properties:
        effectiveAt: { type: string, format: date-time }
    ScheduleBillingChangeRequest:
      type: object
      additionalProperties: false
      required: [kind]
      properties:
        kind: { type: string, enum: [PLAN_CHANGE, PERIOD_CHANGE, ADDON_CHANGE, CANCELLATION] }
        effectiveAt: { type: string, format: date-time }
        targetPlanCode: { $ref: "#/components/schemas/FairScalePlanCode" }
        targetBillingPeriod: { $ref: "#/components/schemas/BillingPeriod" }
        addonCode: { type: string, maxLength: 64 }
        addonQuantity: { type: integer, minimum: 0, maximum: 10000 }
    RunBillingJobRequest:
      type: object
      additionalProperties: false
      properties:
        at: { type: string, format: date-time }
        limit: { type: integer, minimum: 1, maximum: 500 }
        provider: { type: string, enum: [TEST] }
    IntelligenceMetricKind:
      type: string
      enum: [ACTIVITY, CURRENT_STATE]
    IntelligenceMetricCode:
      type: string
      enum: [SALES_ISSUED, PAYMENTS_RECORDED, RECEIVABLES_OUTSTANDING, QUOTE_ORDER_CONVERSION, EXPENSES_RECORDED, CASH_BALANCE, INVENTORY_ON_HAND, PURCHASE_ORDERS_PENDING, PROJECTS_OVERDUE, CRM_PIPELINE, NETWORK_INQUIRIES_CONVERTED]
    IntelligenceDecimal:
      type: string
      pattern: '^-?(0|[1-9][0-9]*)(\.[0-9]+)?$'
      description: Exact decimal string; never a JSON floating-point number.
    IntelligenceMetricPayload:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        count: { type: integer, minimum: 0 }
        amount: { $ref: "#/components/schemas/IntelligenceDecimal" }
        currency: { type: string, pattern: '^[A-Z]{3}$' }
        numerator: { type: integer, minimum: 0 }
        denominator: { type: integer, minimum: 0 }
        ratio: { $ref: "#/components/schemas/IntelligenceDecimal" }
        quantity: { $ref: "#/components/schemas/IntelligenceDecimal" }
        unit: { type: string, minLength: 1, maxLength: 32 }
        missingValueCount: { type: integer, minimum: 0 }
    IntelligenceMetricValue:
      type: object
      additionalProperties: false
      required: [metricCode, definitionVersion, kind, calculatedAt, sourceAsOf, value]
      properties:
        metricCode: { $ref: "#/components/schemas/IntelligenceMetricCode" }
        definitionVersion: { type: integer, minimum: 1 }
        kind: { $ref: "#/components/schemas/IntelligenceMetricKind" }
        calculatedAt: { type: string, format: date-time }
        sourceAsOf: { type: string, format: date-time }
        period:
          type: object
          additionalProperties: false
          required: [from, to]
          properties:
            from: { type: string, format: date-time }
            to: { type: string, format: date-time }
        dimensions:
          type: object
          additionalProperties: false
          properties:
            establishmentId: { type: string, format: uuid }
            currency: { type: string, pattern: '^[A-Z]{3}$' }
            accountId: { type: string, format: uuid }
            warehouseId: { type: string, format: uuid }
            itemId: { type: string, format: uuid }
            unit: { type: string, minLength: 1, maxLength: 32 }
        value: { $ref: "#/components/schemas/IntelligenceMetricPayload" }
    IntelligenceDashboard:
      type: object
      additionalProperties: false
      required: [metrics, openAlerts, calculatedAt, sourceAsOf]
      properties:
        metrics:
          type: array
          items: { $ref: "#/components/schemas/IntelligenceMetricValue" }
        openAlerts:
          type: array
          maxItems: 20
          items: { $ref: "#/components/schemas/IntelligenceAlert" }
        calculatedAt: { type: string, format: date-time }
        sourceAsOf: { type: string, format: date-time }
    IntelligenceMetricPage:
      type: object
      additionalProperties: false
      required: [items, hasMore, nextCursor]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/IntelligenceMetricValue" }
        hasMore: { type: boolean }
        nextCursor: { type: [string, 'null'], minLength: 1, maxLength: 2048 }
    IntelligenceAlert:
      type: object
      additionalProperties: false
      required: [id, ruleCode, ruleVersion, severity, status, sourceType, sourceId, triggeredAt, lastEvaluatedAt]
      properties:
        id: { type: string, format: uuid }
        ruleCode: { type: string, enum: [INVOICE_OVERDUE, PROJECT_OVERDUE] }
        ruleVersion: { type: integer, minimum: 1 }
        severity: { type: string, enum: [WARNING] }
        status: { type: string, enum: [OPEN, RESOLVED] }
        sourceType: { type: string, enum: [INVOICE, PROJECT] }
        sourceId: { type: string, format: uuid }
        establishmentId: { type: [string, 'null'], format: uuid }
        triggeredAt: { type: string, format: date-time }
        lastEvaluatedAt: { type: string, format: date-time }
        resolvedAt: { type: [string, 'null'], format: date-time }
    IntelligenceAlertPage:
      type: object
      additionalProperties: false
      required: [items, hasMore, nextCursor]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/IntelligenceAlert" }
        hasMore: { type: boolean }
        nextCursor: { type: [string, 'null'], minLength: 1, maxLength: 2048 }
