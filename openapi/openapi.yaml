openapi: 3.1.0
info:
  title: Monarque Connect API
  version: 0.2.0
  description: Monarque Connect v1.2 API-first autonomous backend with Network, Business OS, Intelligence, Control Plane and AI-native foundations.
servers:
  - url: /api/v1
security:
  - bearerAuth: []
tags:
  - { name: Health }
  - { name: Auth }
  - { name: Organizations }
  - { name: Establishments }
  - { name: Capabilities }
  - { name: Memberships }
  - { name: Parties }
  - { name: Catalog }
  - { name: CRM }
  - { name: Quotes }
  - { name: Orders }
  - { name: Invoices }
  - { name: Payments }
  - { name: Purchases }
  - { name: Expenses }
  - { name: Cash }
  - { name: Inventory }
  - { name: Projects }
  - { name: Exports }
  - { name: Network }
  - { name: Messaging }
  - { name: Intelligence }
  - { name: Platform }

paths:
  /health/live:
    get:
      security: []
      tags: [Health]
      operationId: healthLive
      responses:
        "200": { description: Live }
  /health/ready:
    get:
      security: []
      tags: [Health]
      operationId: healthReady
      responses:
        "200": { description: Ready }

  /auth/register:
    post:
      security: []
      tags: [Auth]
      operationId: register
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RegisterRequest" }
      responses:
        "201":
          description: Registered user
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "409": { $ref: "#/components/responses/Conflict" }
  /auth/login:
    post:
      security: []
      tags: [Auth]
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LoginRequest" }
      responses:
        "200":
          description: Authenticated session
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TokenPair" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /auth/refresh:
    post:
      security: []
      tags: [Auth]
      operationId: refresh
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RefreshRequest" }
      responses:
        "200":
          description: Session rotated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TokenPair" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /auth/logout:
    post:
      tags: [Auth]
      operationId: logout
      responses:
        "204": { description: Logged out }
  /auth/password/change:
    post:
      tags: [Auth]
      operationId: changePassword
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ChangePasswordRequest" }
      responses:
        "204": { description: Password changed and other sessions revoked }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /auth/me:
    get:
      tags: [Auth]
      operationId: getMe
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }

  /organizations:
    get:
      tags: [Organizations]
      operationId: listMyOrganizations
      responses:
        "200":
          description: Organizations
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/OrganizationSummary" }
    post:
      tags: [Organizations]
      operationId: createOrganization
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateOrganizationRequest" }
      responses:
        "201":
          description: Organization and primary establishment created atomically
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OrganizationCreated" }

  /organizations/{organizationId}:
    parameters:
      - $ref: "#/components/parameters/OrganizationId"
    get:
      tags: [Organizations]
      operationId: getOrganization
      responses:
        "200":
          description: Organization
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OrganizationDetail" }
        "403": { $ref: "#/components/responses/Forbidden" }

    patch:
      tags: [Organizations]
      operationId: updateOrganization
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateOrganizationRequest" }
      responses:
        "200":
          description: Organization updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OrganizationDetail" }

  /organizations/{organizationId}/members:
    parameters:
      - $ref: "#/components/parameters/OrganizationId"
    get:
      tags: [Memberships]
      operationId: listMembers
      responses:
        "200": { description: Members }

  /organizations/{organizationId}/members/{membershipId}:
    parameters:
      - $ref: "#/components/parameters/OrganizationId"
      - { name: membershipId, in: path, required: true, schema: { type: string, format: uuid } }
    patch:
      tags: [Memberships]
      operationId: updateMembership
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateMembershipRequest" }
      responses:
        "200": { description: Membership updated }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }

  /organizations/{organizationId}/invitations:
    parameters:
      - $ref: "#/components/parameters/OrganizationId"
    post:
      tags: [Memberships]
      operationId: createInvitation
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateInvitationRequest" }
      responses:
        "201":
          description: Invitation created; the opaque token is returned once
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InvitationCreated" }

  /invitations/{token}/accept:
    post:
      tags: [Memberships]
      operationId: acceptInvitation
      parameters:
        - { name: token, in: path, required: true, schema: { type: string } }
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200": { description: Invitation accepted }


  /organizations/{organizationId}/capabilities:
    parameters:
      - $ref: "#/components/parameters/OrganizationId"
    get:
      tags: [Capabilities]
      operationId: getOrganizationCapabilities
      parameters:
        - name: establishmentId
          in: query
          required: false
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Effective tenant capabilities and accessible establishments
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Capabilities" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /organizations/{organizationId}/modules:
    parameters:
      - $ref: "#/components/parameters/OrganizationId"
    get:
      tags: [Capabilities]
      operationId: listOrganizationModules
      responses:
        "200":
          description: Effective module entitlements and activation state
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ModuleEntitlement" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /organizations/{organizationId}/modules/{moduleCode}:
    parameters:
      - $ref: "#/components/parameters/OrganizationId"
      - name: moduleCode
        in: path
        required: true
        schema: { type: string, pattern: "^[A-Z][A-Z0-9_]{1,63}$" }
    patch:
      tags: [Capabilities]
      operationId: updateOrganizationModuleActivation
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateModuleActivationRequest" }
      responses:
        "200":
          description: Activation transition result
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ModuleActivationResult" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /organizations/{organizationId}/quotas:
    parameters:
      - $ref: "#/components/parameters/OrganizationId"
    get:
      tags: [Capabilities]
      operationId: listOrganizationQuotas
      responses:
        "200":
          description: Effective quota limits and current period usage
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/QuotaUsage" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /organizations/{organizationId}/establishments:
    parameters:
      - $ref: "#/components/parameters/OrganizationId"
    get:
      tags: [Establishments]
      operationId: listEstablishments
      responses:
        "200":
          description: Establishments visible after membership scope filtering
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Establishment" }
    post:
      tags: [Establishments]
      operationId: createEstablishment
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateEstablishmentRequest" }
      responses:
        "201": { description: Establishment created }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }

  /organizations/{organizationId}/establishments/{establishmentId}:
    parameters:
      - $ref: "#/components/parameters/OrganizationId"
      - $ref: "#/components/parameters/EstablishmentId"
    get:
      tags: [Establishments]
      operationId: getEstablishment
      responses:
        "200":
          description: Establishment
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Establishment" }
        "403": { $ref: "#/components/responses/Forbidden" }
    patch:
      tags: [Establishments]
      operationId: updateEstablishment
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateEstablishmentRequest" }
      responses:
        "200":
          description: Establishment updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Establishment" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /organizations/{organizationId}/parties:
    parameters:
      - $ref: "#/components/parameters/OrganizationId"
    get:
      tags: [Parties]
      operationId: listParties
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
        - name: type
          in: query
          schema: { type: string, enum: [CUSTOMER, SUPPLIER, BOTH] }
        - name: active
          in: query
          schema: { type: boolean }
        - name: search
          in: query
          schema: { type: string, maxLength: 160 }
      responses:
        "200":
          description: Business parties
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PartyPage" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [Parties]
      operationId: createParty
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreatePartyRequest" }
      responses:
        "201":
          description: Business party created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BusinessParty" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }

  /organizations/{organizationId}/parties/{partyId}:
    parameters:
      - $ref: "#/components/parameters/OrganizationId"
      - name: partyId
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [Parties]
      operationId: getParty
      responses:
        "200":
          description: Business party
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BusinessParty" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [Parties]
      operationId: updateParty
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdatePartyRequest" }
      responses:
        "200":
          description: Business party updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BusinessParty" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /organizations/{organizationId}/parties/{partyId}/deactivate:
    parameters:
      - $ref: "#/components/parameters/OrganizationId"
      - name: partyId
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      tags: [Parties]
      operationId: deactivateParty
      responses:
        "200":
          description: Business party deactivated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BusinessParty" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /organizations/{organizationId}/parties/{partyId}/reactivate:
    parameters:
      - $ref: "#/components/parameters/OrganizationId"
      - name: partyId
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      tags: [Parties]
      operationId: reactivateParty
      responses:
        "200":
          description: Business party reactivated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BusinessParty" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /organizations/{organizationId}/items:
    parameters:
      - $ref: "#/components/parameters/OrganizationId"
    get:
      tags: [Catalog]
      operationId: listItems
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
        - name: type
          in: query
          schema: { type: string, enum: [PRODUCT, SERVICE] }
        - name: active
          in: query
          schema: { type: boolean }
        - name: search
          in: query
          schema: { type: string, maxLength: 160 }
      responses:
        "200":
          description: Catalog items
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ItemPage" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [Catalog]
      operationId: createItem
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateItemRequest" }
      responses:
        "201":
          description: Catalog item created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CatalogItem" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }

  /organizations/{organizationId}/items/{itemId}:
    parameters:
      - $ref: "#/components/parameters/OrganizationId"
      - name: itemId
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [Catalog]
      operationId: getItem
      responses:
        "200":
          description: Catalog item
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CatalogItem" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [Catalog]
      operationId: updateItem
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateItemRequest" }
      responses:
        "200":
          description: Catalog item updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CatalogItem" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /organizations/{organizationId}/items/{itemId}/deactivate:
    parameters:
      - $ref: "#/components/parameters/OrganizationId"
      - name: itemId
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      tags: [Catalog]
      operationId: deactivateItem
      responses:
        "200":
          description: Catalog item deactivated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CatalogItem" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /organizations/{organizationId}/items/{itemId}/reactivate:
    parameters:
      - $ref: "#/components/parameters/OrganizationId"
      - name: itemId
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      tags: [Catalog]
      operationId: reactivateItem
      responses:
        "200":
          description: Catalog item reactivated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CatalogItem" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /organizations/{organizationId}/establishments/{establishmentId}/warehouses:
    parameters:
      - $ref: "#/components/parameters/OrganizationId"
      - $ref: "#/components/parameters/EstablishmentId"
    get:
      tags: [Inventory]
      operationId: listWarehouses
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
        - name: active
          in: query
          schema: { type: boolean }
      responses:
        "200":
          description: Establishment warehouses
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WarehousePage" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [Inventory]
      operationId: createWarehouse
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateWarehouseRequest" }
      responses:
        "201":
          description: Warehouse created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Warehouse" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }

  /organizations/{organizationId}/establishments/{establishmentId}/warehouses/{warehouseId}:
    parameters:
      - $ref: "#/components/parameters/OrganizationId"
      - $ref: "#/components/parameters/EstablishmentId"
      - name: warehouseId
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [Inventory]
      operationId: getWarehouse
      responses:
        "200":
          description: Warehouse
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Warehouse" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [Inventory]
      operationId: updateWarehouse
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateWarehouseRequest" }
      responses:
        "200":
          description: Warehouse updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Warehouse" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /organizations/{organizationId}/establishments/{establishmentId}/warehouses/{warehouseId}/deactivate:
    parameters:
      - $ref: "#/components/parameters/OrganizationId"
      - $ref: "#/components/parameters/EstablishmentId"
      - name: warehouseId
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      tags: [Inventory]
      operationId: deactivateWarehouse
      responses:
        "200":
          description: Warehouse deactivated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Warehouse" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /organizations/{organizationId}/establishments/{establishmentId}/warehouses/{warehouseId}/reactivate:
    parameters:
      - $ref: "#/components/parameters/OrganizationId"
      - $ref: "#/components/parameters/EstablishmentId"
      - name: warehouseId
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      tags: [Inventory]
      operationId: reactivateWarehouse
      responses:
        "200":
          description: Warehouse reactivated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Warehouse" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /organizations/{organizationId}/leads:
    parameters:
      - $ref: "#/components/parameters/OrganizationId"
    get:
      tags: [CRM]
      operationId: listLeads
      parameters:
        - { name: status, in: query, schema: { $ref: "#/components/schemas/LeadStatus" } }
        - { name: q, in: query, schema: { type: string, maxLength: 100 } }
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Tenant-scoped CRM leads
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LeadPage" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [CRM]
      operationId: createLead
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateLeadRequest" }
      responses:
        "201":
          description: Lead created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Lead" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }

  /organizations/{organizationId}/opportunities:
    parameters:
      - $ref: "#/components/parameters/OrganizationId"
    get:
      tags: [CRM]
      operationId: listOpportunities
      parameters:
        - { name: status, in: query, schema: { $ref: "#/components/schemas/OpportunityStatus" } }
        - { name: establishmentId, in: query, schema: { type: string, format: uuid } }
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Establishment-scoped opportunities
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OpportunityPage" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [CRM]
      operationId: createOpportunity
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateOpportunityRequest" }
      responses:
        "201":
          description: Opportunity created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Opportunity" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }

  /organizations/{organizationId}/leads/{leadId}/status:
    parameters:
      - $ref: "#/components/parameters/OrganizationId"
      - name: leadId
        in: path
        required: true
        schema: { type: string, format: uuid }
      - $ref: "#/components/parameters/IdempotencyKey"
    post:
      tags: [CRM]
      operationId: transitionLead
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TransitionLeadRequest" }
      responses:
        "200":
          description: Lead transitioned
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Lead" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /organizations/{organizationId}/opportunities/{opportunityId}/status:
    parameters:
      - $ref: "#/components/parameters/OrganizationId"
      - name: opportunityId
        in: path
        required: true
        schema: { type: string, format: uuid }
      - $ref: "#/components/parameters/IdempotencyKey"
    post:
