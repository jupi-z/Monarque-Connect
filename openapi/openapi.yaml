openapi: 3.1.0
info:
  title: Monarque Connect API
  version: 0.2.0
  description: Monarque Connect v1.2 API-first autonomous backend with Network, Business OS, Intelligence, Control Plane and AI-native foundations.
servers:
  - url: /api/v1
security:
  - bearerAuth: []
tags:
  - { name: Health }
  - { name: Auth }
  - { name: Organizations }
  - { name: Establishments }
  - { name: Capabilities }
  - { name: Memberships }
  - { name: Parties }
  - { name: Catalog }
  - { name: CRM }
  - { name: Quotes }
  - { name: Orders }
  - { name: Invoices }
  - { name: Payments }
  - { name: Purchases }
  - { name: Expenses }
  - { name: Cash }
  - { name: Inventory }
  - { name: Projects }
  - { name: Exports }
  - { name: Network }
  - { name: Messaging }
  - { name: Intelligence }
  - { name: Platform }

paths:
  /health/live:
    get:
      security: []
      tags: [Health]
      operationId: healthLive
      responses:
        "200": { description: Live }
  /health/ready:
    get:
      security: []
      tags: [Health]
      operationId: healthReady
      responses:
        "200": { description: Ready }

  /auth/register:
    post:
      security: []
      tags: [Auth]
      operationId: register
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RegisterRequest" }
      responses:
        "201":
          description: Registered user
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "409": { $ref: "#/components/responses/Conflict" }
  /auth/login:
    post:
      security: []
      tags: [Auth]
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LoginRequest" }
      responses:
        "200":
          description: Authenticated session
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TokenPair" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /auth/refresh:
    post:
      security: []
      tags: [Auth]
      operationId: refresh
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RefreshRequest" }
      responses:
        "200":
          description: Session rotated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TokenPair" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /auth/logout:
    post:
      tags: [Auth]
      operationId: logout
      responses:
        "204": { description: Logged out }
  /auth/password/change:
    post:
      tags: [Auth]
      operationId: changePassword
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ChangePasswordRequest" }
      responses:
        "204": { description: Password changed and other sessions revoked }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /auth/me:
    get:
      tags: [Auth]
      operationId: getMe
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }

  /organizations:
    get:
      tags: [Organizations]
      operationId: listMyOrganizations
      responses:
        "200":
          description: Organizations
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/OrganizationSummary" }
    post:
      tags: [Organizations]
      operationId: createOrganization
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateOrganizationRequest" }
      responses:
        "201":
          description: Organization and primary establishment created atomically
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OrganizationCreated" }

  /organizations/{organizationId}:
    parameters:
      - $ref: "#/components/parameters/OrganizationId"
    get:
      tags: [Organizations]
      operationId: getOrganization
      responses:
        "200":
          description: Organization
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OrganizationDetail" }
        "403": { $ref: "#/components/responses/Forbidden" }
    patch:
      tags: [Organizations]
      operationId: updateOrganization
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateOrganizationRequest" }
      responses:
        "200":
          description: Organization updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OrganizationDetail" }

  /organizations/{organizationId}/members:
    parameters:
      - $ref: "#/components/parameters/OrganizationId"
    get:
      tags: [Memberships]
      operationId: listMembers
      responses:
        "200": { description: Members }

  /organizations/{organizationId}/members/{membershipId}:
    parameters:
      - $ref: "#/components/parameters/OrganizationId"
      - { name: membershipId, in: path, required: true, schema: { type: string, format: uuid } }
    patch:
      tags: [Memberships]
      operationId: updateMembership
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateMembershipRequest" }
      responses:
        "200": { description: Membership updated }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }

  /organizations/{organizationId}/invitations:
    parameters:
      - $ref: "#/components/parameters/OrganizationId"
    post:
      tags: [Memberships]
      operationId: createInvitation
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateInvitationRequest" }
      responses:
        "201":
          description: Invitation created; the opaque token is returned once
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InvitationCreated" }

  /invitations/{token}/accept:
    post:
      tags: [Memberships]
      operationId: acceptInvitation
      parameters:
        - { name: token, in: path, required: true, schema: { type: string } }
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200": { description: Invitation accepted }


  /organizations/{organizationId}/capabilities:
    parameters:
      - $ref: "#/components/parameters/OrganizationId"
    get:
      tags: [Capabilities]
      operationId: getOrganizationCapabilities
      parameters:
        - name: establishmentId
          in: query
          required: false
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Effective tenant capabilities and accessible establishments
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Capabilities" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /organizations/{organizationId}/modules:
    parameters:
      - $ref: "#/components/parameters/OrganizationId"
    get:
      tags: [Capabilities]
      operationId: listOrganizationModules
      responses:
        "200":
          description: Effective module entitlements and activation state
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ModuleEntitlement" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /organizations/{organizationId}/modules/{moduleCode}:
    parameters:
      - $ref: "#/components/parameters/OrganizationId"
      - name: moduleCode
        in: path
        required: true
        schema: { type: string, pattern: "^[A-Z][A-Z0-9_]{1,63}$" }
    patch:
      tags: [Capabilities]
      operationId: updateOrganizationModuleActivation
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateModuleActivationRequest" }
      responses:
        "200":
          description: Activation transition result
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ModuleActivationResult" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /organizations/{organizationId}/quotas:
    parameters:
      - $ref: "#/components/parameters/OrganizationId"
    get:
      tags: [Capabilities]
      operationId: listOrganizationQuotas
      responses:
        "200":
          description: Effective quota limits and current period usage
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/QuotaUsage" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /organizations/{organizationId}/establishments:
    parameters:
      - $ref: "#/components/parameters/OrganizationId"
    get:
      tags: [Establishments]
      operationId: listEstablishments
      responses:
        "200":
          description: Establishments visible after membership scope filtering
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Establishment" }
    post:
      tags: [Establishments]
      operationId: createEstablishment
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateEstablishmentRequest" }
      responses:
        "201": { description: Establishment created }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }

  /organizations/{organizationId}/establishments/{establishmentId}:
    parameters:
      - $ref: "#/components/parameters/OrganizationId"
      - $ref: "#/components/parameters/EstablishmentId"
    get:
      tags: [Establishments]
      operationId: getEstablishment
      responses:
        "200":
          description: Establishment
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Establishment" }
        "403": { $ref: "#/components/responses/Forbidden" }
    patch:
      tags: [Establishments]
      operationId: updateEstablishment
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateEstablishmentRequest" }
      responses:
        "200":
          description: Establishment updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Establishment" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /organizations/{organizationId}/parties:
    parameters:
      - $ref: "#/components/parameters/OrganizationId"
    get:
      tags: [Parties]
      operationId: listParties
      responses:
        "200": { description: Parties }
    post:
      tags: [Parties]
      operationId: createParty
      responses:
        "201": { description: Party created }

  /organizations/{organizationId}/items:
    parameters:
      - $ref: "#/components/parameters/OrganizationId"
    get:
      tags: [Catalog]
      operationId: listItems
      responses:
        "200": { description: Items }
    post:
      tags: [Catalog]
      operationId: createItem
      responses:
        "201": { description: Item created }

  /organizations/{organizationId}/leads:
    parameters:
      - $ref: "#/components/parameters/OrganizationId"
    get:
      tags: [CRM]
      operationId: listLeads
      responses:
        "200": { description: Leads }
    post:
      tags: [CRM]
      operationId: createLead
      responses:
        "201": { description: Lead created }

  /organizations/{organizationId}/opportunities:
    parameters:
      - $ref: "#/components/parameters/OrganizationId"
    get:
      tags: [CRM]
      operationId: listOpportunities
      responses:
        "200": { description: Opportunities }
    post:
      tags: [CRM]
      operationId: createOpportunity
      responses:
        "201": { description: Opportunity created }

  /organizations/{organizationId}/quotes:
    parameters:
      - $ref: "#/components/parameters/OrganizationId"
    get:
      tags: [Quotes]
      operationId: listQuotes
      responses:
        "200": { description: Quotes }
    post:
      tags: [Quotes]
      operationId: createQuote
      responses:
        "201": { description: Quote created }

  /organizations/{organizationId}/quotes/{quoteId}/send:
    parameters:
      - $ref: "#/components/parameters/OrganizationId"
      - { name: quoteId, in: path, required: true, schema: { type: string, format: uuid } }
      - $ref: "#/components/parameters/IdempotencyKey"
    post:
      tags: [Quotes]
      operationId: sendQuote
      responses:
        "200": { description: Quote sent }

  /organizations/{organizationId}/quotes/{quoteId}/accept:
    parameters:
      - $ref: "#/components/parameters/OrganizationId"
      - { name: quoteId, in: path, required: true, schema: { type: string, format: uuid } }
      - $ref: "#/components/parameters/IdempotencyKey"
    post:
      tags: [Quotes]
      operationId: acceptQuote
      responses:
        "200": { description: Quote accepted }

  /organizations/{organizationId}/quotes/{quoteId}/convert-to-order:
    parameters:
      - $ref: "#/components/parameters/OrganizationId"
      - { name: quoteId, in: path, required: true, schema: { type: string, format: uuid } }
      - $ref: "#/components/parameters/IdempotencyKey"
    post:
      tags: [Quotes, Orders]
      operationId: convertQuoteToOrder
      responses:
        "201": { description: Order created }

  /organizations/{organizationId}/orders:
    parameters:
      - $ref: "#/components/parameters/OrganizationId"
    get:
      tags: [Orders]
      operationId: listOrders
      responses:
        "200": { description: Orders }

  /organizations/{organizationId}/orders/{orderId}/confirm:
    parameters:
      - $ref: "#/components/parameters/OrganizationId"
      - { name: orderId, in: path, required: true, schema: { type: string, format: uuid } }
      - $ref: "#/components/parameters/IdempotencyKey"
    post:
      tags: [Orders]
      operationId: confirmOrder
      responses:
        "200": { description: Confirmed }

  /organizations/{organizationId}/orders/{orderId}/convert-to-invoice:
    parameters:
      - $ref: "#/components/parameters/OrganizationId"
      - { name: orderId, in: path, required: true, schema: { type: string, format: uuid } }
      - $ref: "#/components/parameters/IdempotencyKey"
    post:
      tags: [Orders, Invoices]
      operationId: convertOrderToInvoice
      responses:
        "201": { description: Invoice created }

  /organizations/{organizationId}/invoices:
    parameters:
      - $ref: "#/components/parameters/OrganizationId"
    get:
      tags: [Invoices]
      operationId: listInvoices
      responses:
        "200": { description: Invoices }

  /organizations/{organizationId}/invoices/{invoiceId}/issue:
    parameters:
      - $ref: "#/components/parameters/OrganizationId"
      - { name: invoiceId, in: path, required: true, schema: { type: string, format: uuid } }
      - $ref: "#/components/parameters/IdempotencyKey"
    post:
      tags: [Invoices]
      operationId: issueInvoice
      responses:
        "200": { description: Issued }

  /organizations/{organizationId}/invoices/{invoiceId}/payments:
    parameters:
      - $ref: "#/components/parameters/OrganizationId"
      - { name: invoiceId, in: path, required: true, schema: { type: string, format: uuid } }
      - $ref: "#/components/parameters/IdempotencyKey"
    post:
      tags: [Payments]
      operationId: recordPayment
      responses:
        "201": { description: Payment recorded }

  /organizations/{organizationId}/expenses:
    parameters:
      - $ref: "#/components/parameters/OrganizationId"
    get:
      tags: [Expenses]
      operationId: listExpenses
      responses:
        "200": { description: Expenses }
    post:
      tags: [Expenses]
      operationId: createExpense
      responses:
        "201": { description: Expense created }

  /organizations/{organizationId}/warehouses:
    parameters:
      - $ref: "#/components/parameters/OrganizationId"
    get:
      tags: [Inventory]
      operationId: listWarehouses
      responses:
        "200": { description: Warehouses }
    post:
      tags: [Inventory]
      operationId: createWarehouse
      responses:
        "201": { description: Warehouse created }

  /organizations/{organizationId}/stock-movements:
    parameters:
      - $ref: "#/components/parameters/OrganizationId"
      - $ref: "#/components/parameters/IdempotencyKey"
    post:
      tags: [Inventory]
      operationId: createStockMovement
      responses:
        "201": { description: Stock movement created }


  /organizations/{organizationId}/supplier-rfqs:
    parameters:
      - $ref: "#/components/parameters/OrganizationId"
    get:
      tags: [Purchases]
      operationId: listSupplierRfqs
      responses:
        "200": { description: Supplier RFQs }
    post:
      tags: [Purchases]
      operationId: createSupplierRfq
      responses:
        "201": { description: Supplier RFQ created }
        "403": { $ref: "#/components/responses/Forbidden" }

  /organizations/{organizationId}/purchase-orders:
    parameters:
      - $ref: "#/components/parameters/OrganizationId"
    get:
      tags: [Purchases]
      operationId: listPurchaseOrders
      responses:
        "200": { description: Purchase orders }
    post:
      tags: [Purchases]
      operationId: createPurchaseOrder
      responses:
        "201": { description: Purchase order created }

  /organizations/{organizationId}/purchase-orders/{purchaseOrderId}/receipts:
    parameters:
      - $ref: "#/components/parameters/OrganizationId"
      - { name: purchaseOrderId, in: path, required: true, schema: { type: string, format: uuid } }
      - $ref: "#/components/parameters/IdempotencyKey"
    post:
      tags: [Purchases, Inventory]
      operationId: createGoodsReceipt
      responses:
        "201": { description: Goods receipt created and stock effects applied once }

  /organizations/{organizationId}/cash-accounts:
    parameters:
      - $ref: "#/components/parameters/OrganizationId"
    get:
      tags: [Cash]
      operationId: listCashAccounts
      responses:
        "200": { description: Cash accounts }
    post:
      tags: [Cash]
      operationId: createCashAccount
      responses:
        "201": { description: Cash account created }

  /organizations/{organizationId}/cash-movements:
    parameters:
      - $ref: "#/components/parameters/OrganizationId"
    get:
      tags: [Cash]
      operationId: listCashMovements
      responses:
        "200": { description: Cash movements }
    post:
      tags: [Cash]
      operationId: createCashMovement
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "201": { description: Append-only cash movement recorded }

  /organizations/{organizationId}/projects:
    parameters:
      - $ref: "#/components/parameters/OrganizationId"
    get:
      tags: [Projects]
      operationId: listProjects
      responses:
        "200": { description: Projects }
    post:
      tags: [Projects]
      operationId: createProject
      responses:
        "201": { description: Project created }

  /organizations/{organizationId}/projects/{projectId}/tasks:
    parameters:
      - $ref: "#/components/parameters/OrganizationId"
      - { name: projectId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [Projects]
      operationId: listProjectTasks
      responses:
        "200": { description: Project tasks }
    post:
      tags: [Projects]
      operationId: createProjectTask
      responses:
        "201": { description: Project task created }

  /network/organizations:
    get:
      security: []
      tags: [Network]
      operationId: discoverOrganizations
      parameters:
        - { name: q, in: query, schema: { type: string, maxLength: 100 } }
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200": { description: Public organization profiles }


  /organizations/{organizationId}/network/organizations/{targetOrganizationId}/inquiries:
    parameters:
      - $ref: "#/components/parameters/OrganizationId"
      - { name: targetOrganizationId, in: path, required: true, schema: { type: string, format: uuid } }
      - $ref: "#/components/parameters/IdempotencyKey"
    post:
      tags: [Network]
      operationId: createNetworkInquiry
      responses:
        "201": { description: Commercial inquiry created }
        "403": { $ref: "#/components/responses/Forbidden" }



  /network/organizations/{organizationId}:
    parameters:
      - $ref: "#/components/parameters/OrganizationId"
    get:
      security: []
      tags: [Network]
      operationId: getPublicNetworkOrganization
      responses:
        "200": { description: Public organization profile }
        "404": { description: Profile not public or not found }

  /network/organizations/{organizationId}/catalog:
    parameters:
      - $ref: "#/components/parameters/OrganizationId"
    get:
      security: []
      tags: [Network]
      operationId: getPublicNetworkOrganizationCatalog
      responses:
        "200": { description: Public catalog projection for the organization }

  /network/organizations/{organizationId}/trust:
    parameters:
      - $ref: "#/components/parameters/OrganizationId"
    get:
      security: []
      tags: [Network]
      operationId: getNetworkOrganizationTrust
      responses:
        "200": { description: Public verification and explicitly published trust signals }

  /organizations/{organizationId}/network-inquiries:
    parameters:
      - $ref: "#/components/parameters/OrganizationId"
    get:
      tags: [Network]
      operationId: listNetworkInquiries
      responses:
        "200": { description: Incoming commercial inquiries }

  /organizations/{organizationId}/network-inquiries/{inquiryId}/convert:
    parameters:
      - $ref: "#/components/parameters/OrganizationId"
      - { name: inquiryId, in: path, required: true, schema: { type: string, format: uuid } }
      - $ref: "#/components/parameters/IdempotencyKey"
    post:
      tags: [Network, CRM]
      operationId: convertNetworkInquiry
      responses:
        "201": { description: Lead or opportunity created from inquiry }

  /organizations/{organizationId}/connection-requests:
    parameters:
      - $ref: "#/components/parameters/OrganizationId"
    post:
      tags: [Network]
      operationId: createConnectionRequest
      responses:
        "201": { description: Connection request created }

  /organizations/{organizationId}/conversations:
    parameters:
      - $ref: "#/components/parameters/OrganizationId"
    get:
      tags: [Messaging]
      operationId: listConversations
      responses:
        "200": { description: Conversations }
    post:
      tags: [Messaging]
      operationId: createConversation
      responses:
        "201": { description: Conversation created }

  /organizations/{organizationId}/conversations/{conversationId}/messages:
    parameters:
      - $ref: "#/components/parameters/OrganizationId"
      - { name: conversationId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [Messaging]
      operationId: listMessages
      responses:
        "200": { description: Messages }
    post:
      tags: [Messaging]
      operationId: sendMessage
      responses:
        "201": { description: Message sent }



  /organizations/{organizationId}/exports:
    parameters:
      - $ref: "#/components/parameters/OrganizationId"
    post:
      tags: [Exports]
      operationId: requestOrganizationExport
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "202": { description: Export requested }
        "403": { $ref: "#/components/responses/Forbidden" }

  /organizations/{organizationId}/exports/{exportId}:
    parameters:
      - $ref: "#/components/parameters/OrganizationId"
      - { name: exportId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [Exports]
      operationId: getOrganizationExport
      responses:
        "200": { description: Export job status and short-lived download metadata when ready }
        "403": { $ref: "#/components/responses/Forbidden" }

  /organizations/{organizationId}/insights/overview:
    parameters:
      - $ref: "#/components/parameters/OrganizationId"
    get:
      tags: [Intelligence]
      operationId: getInsightsOverview
      responses:
        "200": { description: KPI overview restricted to tenant and establishment scope }
        "403": { $ref: "#/components/responses/Forbidden" }

  /organizations/{organizationId}/insights/alerts:
    parameters:
      - $ref: "#/components/parameters/OrganizationId"
    get:
      tags: [Intelligence]
      operationId: listInsightAlerts
      responses:
        "200": { description: Insight alerts }

  /platform/organizations:
    get:
      tags: [Platform]
      operationId: platformListOrganizations
      responses:
        "200": { description: Platform organizations }

  /platform/users:
    get:
      tags: [Platform]
      operationId: platformListUsers
      responses:
        "200": { description: Platform users }

  /platform/module-catalog:
    get:
      tags: [Platform]
      operationId: platformListModuleCatalog
      responses:
        "200": { description: Canonical module catalog }

  /platform/plans:
    get:
      tags: [Platform]
      operationId: platformListPlans
      responses:
        "200": { description: Plans and versions }
    post:
      tags: [Platform]
      operationId: platformCreatePlanVersion
      responses:
        "201": { description: Plan version created }


  /platform/organizations/{organizationId}/verification:
    parameters:
      - $ref: "#/components/parameters/OrganizationId"
    patch:
      tags: [Platform]
      operationId: platformSetOrganizationVerification
      responses:
        "200": { description: Organization verification status updated }

  /platform/organizations/{organizationId}/subscription:
    parameters:
      - $ref: "#/components/parameters/OrganizationId"
    patch:
      tags: [Platform]
      operationId: platformSetOrganizationSubscription
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SetSubscriptionRequest" }
      responses:
        "200": { description: Subscription changed }
        "409": { $ref: "#/components/responses/Conflict" }

  /platform/organizations/{organizationId}/entitlements:
    parameters:
      - $ref: "#/components/parameters/OrganizationId"
    get:
      tags: [Platform]
      operationId: platformListOrganizationEntitlements
      responses:
        "200": { description: Effective and explicit entitlements }
    post:
      tags: [Platform]
      operationId: platformSetOrganizationEntitlement
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SetEntitlementRequest" }
      responses:
        "200": { description: Entitlement override applied }

  /platform/organizations/{organizationId}/status:
    parameters:
      - $ref: "#/components/parameters/OrganizationId"
    patch:
      tags: [Platform]
      operationId: platformSetOrganizationStatus
      responses:
        "200": { description: Tenant status updated }


components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    OrganizationId:
      name: organizationId
      in: path
      required: true
      schema: { type: string, format: uuid }
    Cursor:
      name: cursor
      in: query
      schema: { type: string }
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
    EstablishmentId:
      name: establishmentId
      in: path
      required: true
      schema: { type: string, format: uuid }
    ModuleCode:
      name: moduleCode
      in: path
      required: true
      schema: { type: string, pattern: "^[A-Z][A-Z0-9_]{1,63}$" }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: { type: string, minLength: 1, maxLength: 128 }
  responses:
    Unauthorized:
      description: Authentication required or invalid
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    Forbidden:
      description: Insufficient permission
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    Conflict:
      description: State conflict
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
  schemas:
    Problem:
      type: object
      required: [type, title, status, requestId]
      properties:
        type: { type: string }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        requestId: { type: string }
        code: { type: string }
    RegisterRequest:
      type: object
      additionalProperties: false
      required: [email, password, firstName, lastName]
      properties:
        email: { type: string, format: email }
        phone: { type: string }
        password: { type: string, minLength: 12, maxLength: 256 }
        firstName: { type: string, minLength: 1, maxLength: 100 }
        lastName: { type: string, minLength: 1, maxLength: 100 }
    LoginRequest:
      type: object
      additionalProperties: false
      required: [identifier, password]
      properties:
        identifier: { type: string }
        password: { type: string }
    RefreshRequest:
      type: object
      additionalProperties: false
      required: [refreshToken]
      properties:
        refreshToken: { type: string, minLength: 32, maxLength: 512 }
    ChangePasswordRequest:
      type: object
      additionalProperties: false
      required: [currentPassword, newPassword]
      properties:
        currentPassword: { type: string }
        newPassword: { type: string, minLength: 12, maxLength: 256 }
    TokenPair:
      type: object
      additionalProperties: false
      required: [accessToken, refreshToken, sessionId]
      properties:
        accessToken: { type: string }
        refreshToken: { type: string }
        sessionId: { type: string, format: uuid }
    User:
      type: object
      additionalProperties: false
      required: [id, email, firstName, lastName]
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        firstName: { type: string }
        lastName: { type: string }
    OrganizationSummary:
      type: object
      additionalProperties: false
      required: [id, name, handle, defaultCurrency, businessTypeCode, status]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        handle: { type: string }
        defaultCurrency: { type: string, pattern: "^[A-Z]{3}$" }
        businessTypeCode: { type: string }
        status: { type: string, enum: [ACTIVE] }
    OrganizationDetail:
      allOf:
        - $ref: "#/components/schemas/OrganizationSummary"
        - type: object
          required: [role, scopeMode]
          properties:
            legalName: { type: [string, 'null'] }
            role: { type: string, enum: [OWNER, ADMIN, SALES, FINANCE, OPERATIONS, VIEWER] }
            scopeMode: { type: string, enum: [ALL_ESTABLISHMENTS, SELECTED_ESTABLISHMENTS] }
    Establishment:
      type: object
      additionalProperties: false
      required: [id, code, name, type, isPrimary, status]
      properties:
        id: { type: string, format: uuid }
        code: { type: string }
        name: { type: string }
        type: { type: string, enum: [HEAD_OFFICE, BRANCH, SHOP, OFFICE, SERVICE_POINT, OTHER] }
        isPrimary: { type: boolean }
        status: { type: string, enum: [ACTIVE] }
    OrganizationCreated:
      allOf:
        - $ref: "#/components/schemas/OrganizationSummary"
        - type: object
          required: [establishment]
          properties:
            establishment: { $ref: "#/components/schemas/Establishment" }
    Capabilities:
      type: object
      additionalProperties: false
      required: [capabilitiesVersion, organizationId, evaluatedAt, businessTypeCode, defaultCurrency, role, scopeMode, activeEstablishmentId, establishments, plan, subscription, modules, permissions]
      properties:
        capabilitiesVersion: { type: integer, const: 1 }
        organizationId: { type: string, format: uuid }
        evaluatedAt: { type: string, format: date-time }
        businessTypeCode: { type: string }
        defaultCurrency: { type: string, pattern: "^[A-Z]{3}$" }
        role: { type: string, enum: [OWNER, ADMIN, SALES, FINANCE, OPERATIONS, VIEWER] }
        scopeMode: { type: string, enum: [ALL_ESTABLISHMENTS, SELECTED_ESTABLISHMENTS] }
        activeEstablishmentId: { type: [string, 'null'], format: uuid }
        establishments:
          type: array
          items: { $ref: "#/components/schemas/Establishment" }
        plan:
          oneOf:
            - type: 'null'
            - type: object
              additionalProperties: false
              required: [code, version]
              properties:
                code: { type: string }
                version: { type: integer, minimum: 1 }
        subscription:
          oneOf:
            - type: 'null'
            - type: object
              additionalProperties: false
              required: [id, status, startsAt, endsAt]
              properties:
                id: { type: string, format: uuid }
                status: { type: string, enum: [TRIALING, ACTIVE, PAST_DUE] }
                startsAt: { type: string, format: date-time }
                endsAt: { type: [string, 'null'], format: date-time }
        modules:
          type: array
          items: { $ref: "#/components/schemas/ModuleEntitlement" }
        permissions:
          type: array
          items: { type: string }
    ModuleEntitlement:
      type: object
      additionalProperties: false
      required: [code, displayName, pillar, isCore, availability, dependencies, entitled, active, allowed, reason, source]
      properties:
        code: { type: string }
        displayName: { type: string }
        pillar: { type: string }
        isCore: { type: boolean }
        availability: { type: string, enum: [MVP, BETA, FUTURE, RETIRED] }
        dependencies:
          type: array
          uniqueItems: true
          items: { type: string }
        entitled: { type: boolean }
        active: { type: boolean }
        allowed: { type: boolean }
        reason:
          type: string
          enum: [CORE_MODULE, PLAN_INCLUDED, MODULE_NOT_INCLUDED, NO_ACTIVE_SUBSCRIPTION, SUBSCRIPTION_INACTIVE, DEPENDENCY_NOT_ENTITLED, MODULE_RETIRED, MODULE_DEACTIVATED]
        source: { type: string, enum: [CORE, PLAN, NONE] }
    UpdateModuleActivationRequest:
      type: object
      additionalProperties: false
      required: [enabled, reason]
      properties:
        enabled: { type: boolean }
        reason: { type: string, minLength: 3, maxLength: 500 }
    ModuleActivationResult:
      type: object
      additionalProperties: false
      required: [moduleCode, enabled, changed]
      properties:
        moduleCode: { type: string }
        enabled: { type: boolean }
        changed: { type: boolean }
    QuotaUsage:
      type: object
      additionalProperties: false
      required: [quotaCode, unit, limit, used, reserved, available, periodKey]
      properties:
        quotaCode: { type: string }
        unit: { type: string, enum: [COUNT, BYTES] }
        limit: { type: string, pattern: "^[0-9]+$" }
        used: { type: string, pattern: "^[0-9]+$" }
        reserved: { type: string, pattern: "^[0-9]+$" }
        available: { type: string, pattern: "^[0-9]+$" }
        periodKey: { type: string }
    CreateOrganizationRequest:
      type: object
      additionalProperties: false
      required: [businessTypeCode, name, handle, defaultCurrency, establishmentName]
      properties:
        businessTypeCode:
          type: string
          pattern: "^[A-Z][A-Z0-9_]{1,63}$"
        name: { type: string, minLength: 2, maxLength: 160 }
        legalName: { type: string, maxLength: 200 }
        handle: { type: string, pattern: "^[a-z0-9][a-z0-9-]{2,49}$" }
        defaultCurrency: { type: string, pattern: "^[A-Z]{3}$" }
        establishmentName: { type: string, minLength: 1, maxLength: 160 }
        establishmentCode: { type: string, minLength: 1, maxLength: 50 }
        establishmentType:
          type: string
          enum: [HEAD_OFFICE, BRANCH, SHOP, OFFICE, SERVICE_POINT, OTHER]
    UpdateOrganizationRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name: { type: string, minLength: 2, maxLength: 160 }
        legalName: { type: string, maxLength: 200 }
    CreateInvitationRequest:
      type: object
      additionalProperties: false
      required: [email, role, scopeMode]
      properties:
        email: { type: string, format: email }
        role: { type: string, enum: [ADMIN, SALES, FINANCE, OPERATIONS, VIEWER] }
        scopeMode: { type: string, enum: [ALL_ESTABLISHMENTS, SELECTED_ESTABLISHMENTS] }
        establishmentIds:
          type: array
          uniqueItems: true
          items: { type: string, format: uuid }
    UpdateMembershipRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        role: { type: string, enum: [ADMIN, SALES, FINANCE, OPERATIONS, VIEWER] }
        status: { type: string, enum: [ACTIVE, INVITED, SUSPENDED, REVOKED] }
        scopeMode: { type: string, enum: [ALL_ESTABLISHMENTS, SELECTED_ESTABLISHMENTS] }
        establishmentIds:
          type: array
          uniqueItems: true
          items: { type: string, format: uuid }
    InvitationCreated:
      type: object
      additionalProperties: false
      required: [id, organizationId, email, role, scopeMode, expiresAt, token]
      properties:
        id: { type: string, format: uuid }
        organizationId: { type: string, format: uuid }
        email: { type: string, format: email }
        role: { type: string, enum: [ADMIN, SALES, FINANCE, OPERATIONS, VIEWER] }
        scopeMode: { type: string, enum: [ALL_ESTABLISHMENTS, SELECTED_ESTABLISHMENTS] }
        expiresAt: { type: string, format: date-time }
        token: { type: string }

    CreateEstablishmentRequest:
      type: object
      additionalProperties: false
      required: [code, name, type]
      properties:
        code: { type: string, minLength: 1, maxLength: 50 }
        name: { type: string, minLength: 1, maxLength: 160 }
        type:
          type: string
          enum: [HEAD_OFFICE, BRANCH, SHOP, OFFICE, SERVICE_POINT, OTHER]
    UpdateEstablishmentRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name: { type: string, minLength: 1, maxLength: 160 }
        type:
          type: string
          enum: [HEAD_OFFICE, BRANCH, SHOP, OFFICE, SERVICE_POINT, OTHER]
    SetModuleActivationRequest:
      type: object
      additionalProperties: false
      required: [enabled]
      properties:
        enabled: { type: boolean }
    SetSubscriptionRequest:
      type: object
      additionalProperties: false
      required: [planCode, planVersion]
      properties:
        planCode: { type: string }
        planVersion: { type: integer, minimum: 1 }
        managedService: { type: boolean, default: false }
    SetEntitlementRequest:
      type: object
      additionalProperties: false
      required: [moduleCode, effect, reason]
      properties:
        moduleCode: { type: string }
        effect:
          type: string
          enum: [ALLOW, DENY, LIMIT_OVERRIDE]
        reason: { type: string, minLength: 1, maxLength: 500 }
        limits:
          type: object
          additionalProperties: true
