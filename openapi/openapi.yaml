components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    OrganizationId:
      name: organizationId
      in: path
      required: true
      schema: { type: string, format: uuid }
    Cursor:
      name: cursor
      in: query
      schema: { type: string }
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
    EstablishmentId:
      name: establishmentId
      in: path
      required: true
      schema: { type: string, format: uuid }
    EstablishmentFilterId:
      name: establishmentId
      in: query
      required: false
      schema: { type: string, format: uuid }
    WarehouseFilterId:
      name: warehouseId
      in: query
      required: false
      schema: { type: string, format: uuid }
    ItemFilterId:
      name: itemId
      in: query
      required: false
      schema: { type: string, format: uuid }
    CashAccountFilterId:
      name: cashAccountId
      in: query
      required: false
      schema: { type: string, format: uuid }
    ExpenseStatusFilter:
      name: status
      in: query
      required: false
      schema: { $ref: "#/components/schemas/ExpenseStatus" }
    ModuleCode:
      name: moduleCode
      in: path
      required: true
      schema: { type: string, pattern: "^[A-Z][A-Z0-9_]{1,63}$" }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: { type: string, minLength: 1, maxLength: 128 }
  responses:
    BadRequest:
      description: Invalid request
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    Unauthorized:
      description: Authentication required or invalid
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    Forbidden:
      description: Insufficient permission
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    NotFound:
      description: Resource not found
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    NotImplemented:
      description: Route is registered but the Phase 10A projection runtime is not yet delivered
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    Conflict:
      description: State conflict
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    TooManyRequests:
      description: Persistent anti-abuse or rate limit policy refused the command
      headers:
        Retry-After:
          schema: { type: integer, minimum: 1 }
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
  schemas:
    Problem:
      type: object
      required: [type, title, status, requestId]
      properties:
        type: { type: string }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        requestId: { type: string }
        code: { type: string }
    LeadStatus:
      type: string
      enum: [NEW, QUALIFIED, CONVERTED, DISMISSED]
    OpportunityStatus:
      type: string
      enum: [OPEN, WON, LOST, CANCELLED]
    NetworkInquiryStatus:
      type: string
      enum: [NEW, QUALIFIED, DISMISSED, CONVERTED]
    ConnectionRequestStatus:
      type: string
      enum: [PENDING, ACCEPTED, DECLINED, CANCELLED]
    NetworkVerificationStatus:
      type: string
      enum: [UNVERIFIED, VERIFIED, EXPIRED]
    NetworkTrust:
      type: object
      additionalProperties: false
      required: [organizationId, verificationStatus, verifiedAt, verificationExpiresAt]
      properties:
        organizationId: { type: string, format: uuid }
        verificationStatus: { $ref: "#/components/schemas/NetworkVerificationStatus" }
        verifiedAt: { type: [string, 'null'], format: date-time }
        verificationExpiresAt: { type: [string, 'null'], format: date-time }
    SetNetworkTrustRequest:
      type: object
      additionalProperties: false
      required: [status, reason]
      properties:
        status: { $ref: "#/components/schemas/NetworkVerificationStatus" }
        reason: { type: string, minLength: 1, maxLength: 500 }
        method: { type: [string, 'null'], maxLength: 80 }
        verificationExpiresAt: { type: [string, 'null'], format: date-time }
    ConversationStatus:
      type: string
      enum: [OPEN, SUSPENDED]
    ConversationInvitationType:
      type: string
      enum: [ORGANIZATION, USER]
    ConversationInvitationStatus:
      type: string
      enum: [PENDING, ACCEPTED, DECLINED, REVOKED, EXPIRED]
    ConversationParticipantStatus:
      type: string
      enum: [ACTIVE, LEFT, REVOKED]
    Conversation:
      type: object
      additionalProperties: false
      required: [id, organizationId, counterpartOrganizationId, status, participantStatus, lastMessageSequence, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        organizationId: { type: string, format: uuid }
        counterpartOrganizationId: { type: string, format: uuid }
        status: { $ref: "#/components/schemas/ConversationStatus" }
        participantStatus: { $ref: "#/components/schemas/ConversationParticipantStatus" }
        lastMessageSequence: { type: integer, format: int64, minimum: 0 }
