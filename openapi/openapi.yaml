components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    OrganizationId:
      name: organizationId
      in: path
      required: true
      schema: { type: string, format: uuid }
    Cursor:
      name: cursor
      in: query
      schema: { type: string }
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
    EstablishmentId:
      name: establishmentId
      in: path
      required: true
      schema: { type: string, format: uuid }
    ModuleCode:
      name: moduleCode
      in: path
      required: true
      schema: { type: string, pattern: "^[A-Z][A-Z0-9_]{1,63}$" }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: { type: string, minLength: 1, maxLength: 128 }
  responses:
    BadRequest:
      description: Invalid request
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    Unauthorized:
      description: Authentication required or invalid
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    Forbidden:
      description: Insufficient permission
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    NotFound:
      description: Resource not found
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    Conflict:
      description: State conflict
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
  schemas:
    Problem:
      type: object
      required: [type, title, status, requestId]
      properties:
        type: { type: string }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        requestId: { type: string }
        code: { type: string }
    LeadStatus:
      type: string
      enum: [NEW, QUALIFIED, CONVERTED, DISMISSED]
    OpportunityStatus:
      type: string
      enum: [OPEN, WON, LOST, CANCELLED]
    NetworkInquiryStatus:
      type: string
      enum: [NEW, QUALIFIED, DISMISSED, CONVERTED]
    ConnectionRequestStatus:
      type: string
