openapi: 3.1.0
info:
  title: Monarque Connect API
  version: 0.2.0
  description: Monarque Connect v1.2 API-first autonomous backend with Network, Business OS, Intelligence, Control Plane and AI-native foundations.
servers:
  - url: /api/v1
security:
  - bearerAuth: []
tags:
  - { name: Health }
  - { name: Auth }
  - { name: Organizations }
  - { name: Establishments }
  - { name: Capabilities }
  - { name: Memberships }
  - { name: Parties }
  - { name: Catalog }
  - { name: CRM }
  - { name: Quotes }
  - { name: Orders }
  - { name: Invoices }
  - { name: Payments }
  - { name: Purchases }
  - { name: Expenses }
  - { name: Cash }
  - { name: Inventory }
  - { name: Projects }
  - { name: Exports }
  - { name: Network }
  - { name: Messaging }
  - { name: Intelligence }
  - { name: Platform }

paths:
  /catalog/measure-units:
    get:
      tags: [Catalog]
      operationId: listMeasureUnits
      responses:
        "200":
          description: Active server-controlled versioned measurement units.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MeasureUnitRegistry" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /catalog/currencies:
    get:
      tags: [Catalog]
      operationId: listCurrencies
      responses:
        "200":
          description: Active supported currency metadata; organization defaults and historical documents are unchanged.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CurrencyRegistry" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /health/live:
    get:
      security: []
      tags: [Health]
      operationId: healthLive
      responses:
        "200": { description: Live }
  /health/ready:
    get:
      security: []
      tags: [Health]
      operationId: healthReady
      responses:
        "200": { description: Ready }

  /auth/register:
    post:
      security: []
      tags: [Auth]
      operationId: register
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RegisterRequest" }
      responses:
        "201":
          description: Registered user
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "409": { $ref: "#/components/responses/Conflict" }
  /auth/login:
    post:
      security: []
      tags: [Auth]
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LoginRequest" }
      responses:
        "200":
          description: Authenticated session
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TokenPair" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /auth/refresh:
    post:
      security: []
      tags: [Auth]
      operationId: refresh
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RefreshRequest" }
      responses:
        "200":
          description: Session rotated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TokenPair" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /auth/logout:
    post:
      tags: [Auth]
      operationId: logout
      responses:
        "204": { description: Logged out }
  /auth/password/change:
    post:
      tags: [Auth]
      operationId: changePassword
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ChangePasswordRequest" }
      responses:
        "204": { description: Password changed and other sessions revoked }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /auth/me:
    get:
      tags: [Auth]
      operationId: getMe
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }

  /organizations:
    get:
      tags: [Organizations]
      operationId: listMyOrganizations
      responses:
        "200":
          description: Organizations
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/OrganizationSummary" }
    post:
      tags: [Organizations]
      operationId: createOrganization
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateOrganizationRequest" }
      responses:
        "201":
          description: Organization and primary establishment created atomically
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OrganizationCreated" }

  /organizations/{organizationId}:
    parameters:
      - $ref: "#/components/parameters/OrganizationId"
    get:
      tags: [Organizations]
      operationId: getOrganization
      responses:
        "200":
          description: Organization
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OrganizationDetail" }
        "403": { $ref: "#/components/responses/Forbidden" }

    patch:
      tags: [Organizations]
      operationId: updateOrganization
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateOrganizationRequest" }
      responses:
        "200":
          description: Organization updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OrganizationDetail" }

  /organizations/{organizationId}/members:
    parameters:
      - $ref: "#/components/parameters/OrganizationId"
    get:
      tags: [Memberships]
      operationId: listMembers
      responses:
        "200": { description: Members }

  /organizations/{organizationId}/members/{membershipId}:
    parameters:
      - $ref: "#/components/parameters/OrganizationId"
      - { name: membershipId, in: path, required: true, schema: { type: string, format: uuid } }
    patch:
      tags: [Memberships]
      operationId: updateMembership
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateMembershipRequest" }
      responses:
        "200": { description: Membership updated }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }

  /organizations/{organizationId}/invitations:
    parameters:
      - $ref: "#/components/parameters/OrganizationId"
    post:
      tags: [Memberships]
      operationId: createInvitation
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateInvitationRequest" }
      responses:
        "201":
          description: Invitation created; the opaque token is returned once
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InvitationCreated" }

  /invitations/{token}/accept:
    post:
      tags: [Memberships]
      operationId: acceptInvitation
      parameters:
        - { name: token, in: path, required: true, schema: { type: string } }
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200": { description: Invitation accepted }


  /organizations/{organizationId}/capabilities:
    parameters:
      - $ref: "#/components/parameters/OrganizationId"
    get:
      tags: [Capabilities]
      operationId: getOrganizationCapabilities
      parameters:
        - name: establishmentId
          in: query
          required: false
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Effective tenant capabilities and accessible establishments
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Capabilities" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /organizations/{organizationId}/modules:
    parameters:
      - $ref: "#/components/parameters/OrganizationId"
    get:
      tags: [Capabilities]
      operationId: listOrganizationModules
      responses:
        "200":
          description: Effective module entitlements and activation state
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ModuleEntitlement" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /organizations/{organizationId}/modules/{moduleCode}:
    parameters:
      - $ref: "#/components/parameters/OrganizationId"
      - name: moduleCode
        in: path
        required: true
        schema: { type: string, pattern: "^[A-Z][A-Z0-9_]{1,63}$" }
    patch:
      tags: [Capabilities]
      operationId: updateOrganizationModuleActivation
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateModuleActivationRequest" }
      responses:
        "200":
          description: Activation transition result
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ModuleActivationResult" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /organizations/{organizationId}/quotas:
    parameters:
      - $ref: "#/components/parameters/OrganizationId"
    get:
      tags: [Capabilities]
      operationId: listOrganizationQuotas
      responses:
        "200":
          description: Effective quota limits and current period usage
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/QuotaUsage" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /organizations/{organizationId}/establishments:
    parameters:
      - $ref: "#/components/parameters/OrganizationId"
    get:
      tags: [Establishments]
      operationId: listEstablishments
      responses:
        "200":
          description: Establishments visible after membership scope filtering
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Establishment" }
    post:
      tags: [Establishments]
      operationId: createEstablishment
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateEstablishmentRequest" }
      responses:
        "201": { description: Establishment created }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }

  /organizations/{organizationId}/establishments/{establishmentId}:
    parameters:
      - $ref: "#/components/parameters/OrganizationId"
      - $ref: "#/components/parameters/EstablishmentId"
    get:
      tags: [Establishments]
      operationId: getEstablishment
      responses:
        "200":
          description: Establishment
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Establishment" }
        "403": { $ref: "#/components/responses/Forbidden" }
    patch:
      tags: [Establishments]
      operationId: updateEstablishment
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateEstablishmentRequest" }
      responses:
        "200":
          description: Establishment updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Establishment" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /organizations/{organizationId}/parties:
    parameters:
      - $ref: "#/components/parameters/OrganizationId"
    get:
      tags: [Parties]
      operationId: listParties
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
        - name: type
          in: query
          schema: { type: string, enum: [CUSTOMER, SUPPLIER, BOTH] }
        - name: active
          in: query
          schema: { type: boolean }
        - name: search
          in: query
          schema: { type: string, maxLength: 160 }
      responses:
        "200":
          description: Business parties
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PartyPage" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [Parties]
      operationId: createParty
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreatePartyRequest" }
      responses:
        "201":
          description: Business party created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BusinessParty" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }

  /organizations/{organizationId}/parties/{partyId}:
    parameters:
      - $ref: "#/components/parameters/OrganizationId"
      - name: partyId
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [Parties]
      operationId: getParty
      responses:
        "200":
          description: Business party
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BusinessParty" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [Parties]
      operationId: updateParty
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdatePartyRequest" }
      responses:
        "200":
          description: Business party updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BusinessParty" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /organizations/{organizationId}/parties/{partyId}/deactivate:
    parameters:
      - $ref: "#/components/parameters/OrganizationId"
      - name: partyId
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      tags: [Parties]
      operationId: deactivateParty
      responses:
        "200":
          description: Business party deactivated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BusinessParty" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /organizations/{organizationId}/parties/{partyId}/reactivate:
    parameters:
      - $ref: "#/components/parameters/OrganizationId"
      - name: partyId
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      tags: [Parties]
      operationId: reactivateParty
      responses:
        "200":
          description: Business party reactivated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BusinessParty" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /organizations/{organizationId}/items:
    parameters:
      - $ref: "#/components/parameters/OrganizationId"
    get:
      tags: [Catalog]
      operationId: listItems
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
        - name: type
          in: query
          schema: { type: string, enum: [PRODUCT, SERVICE] }
        - name: active
          in: query
          schema: { type: boolean }
        - name: search
          in: query
          schema: { type: string, maxLength: 160 }
      responses:
        "200":
          description: Catalog items
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ItemPage" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [Catalog]
      operationId: createItem
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateItemRequest" }
      responses:
        "201":
          description: Catalog item created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CatalogItem" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }

  /organizations/{organizationId}/catalog/offers:
    parameters:
      - $ref: "#/components/parameters/OrganizationId"
    get:
      tags: [Catalog]
      operationId: listCommercialOffers
      x-required-principal: STAFF
      x-required-permissions: [catalog:read]
      x-product-entitlement-required: true
      parameters:
        - name: productCode
          in: query
          required: true
          schema: { type: string, pattern: '^[A-Z][A-Z0-9_]{1,63}$' }
        - $ref: "#/components/parameters/EstablishmentFilterId"
        - name: channelCode
          in: query
          required: false
          schema: { type: string, pattern: '^[A-Za-z][A-Za-z0-9_]{0,47}$' }
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Active offers visible in the authorized tenant, product and establishment scope.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CommercialOfferPage" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      tags: [Catalog]
      operationId: createCommercialOffer
      x-required-principal: STAFF
      x-required-permissions: [catalog:write]
      x-product-entitlement-required: true
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateCommercialOffer" }
      responses:
        "201":
          description: Commercial offer created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CommercialOffer" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /organizations/{organizationId}/catalog/offers/{offerId}:
    parameters:
      - $ref: "#/components/parameters/OrganizationId"
      - name: offerId
        in: path
        required: true
        schema: { type: string, format: uuid }
    patch:
      tags: [Catalog]
      operationId: updateCommercialOffer
      x-required-principal: STAFF
      x-required-permissions: [catalog:write]
      x-product-entitlement-required: true
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateCommercialOffer" }
      responses:
        "200":
          description: Offer metadata or status updated with optimistic concurrency.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CommercialOffer" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /organizations/{organizationId}/catalog/offers/{offerId}/price-versions:
    parameters:
      - $ref: "#/components/parameters/OrganizationId"
      - name: offerId
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      tags: [Catalog]
      operationId: publishCommercialPriceVersion
      x-required-principal: STAFF
      x-required-roles: [OWNER, ADMIN]
      x-required-permissions: [pricing:price:publish]
      x-product-entitlement-required: true
      x-tenant-scoped-resource: CommercialOffer
      x-establishment-scope-derived-from-resource: true
      description: Product and optional establishment scope are derived from the tenant-scoped offer; past effective times are rejected and published versions are immutable.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateCommercialPriceVersion" }
      responses:
        "201":
          description: Immutable commercial price version published.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CommercialPriceVersion" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /organizations/{organizationId}/catalog/items/{itemId}/variants:
    parameters:
      - $ref: "#/components/parameters/OrganizationId"
      - name: itemId
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      tags: [Catalog]
      operationId: createItemVariant
      x-required-principal: STAFF
      x-required-permissions: [catalog:write]
      x-product-entitlement-required: true
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateItemVariant" }
      responses:
        "201":
          description: Item variant created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ItemVariant" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /organizations/{organizationId}/items/{itemId}:
    parameters:
      - $ref: "#/components/parameters/OrganizationId"
      - name: itemId
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [Catalog]
      operationId: getItem
      responses:
        "200":
          description: Catalog item
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CatalogItem" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [Catalog]
      operationId: updateItem
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateItemRequest" }
      responses:
        "200":
          description: Catalog item updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CatalogItem" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /organizations/{organizationId}/items/{itemId}/deactivate:
    parameters:
      - $ref: "#/components/parameters/OrganizationId"
      - name: itemId
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      tags: [Catalog]
      operationId: deactivateItem
      responses:
        "200":
          description: Catalog item deactivated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CatalogItem" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /organizations/{organizationId}/items/{itemId}/reactivate:
    parameters:
      - $ref: "#/components/parameters/OrganizationId"
      - name: itemId
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      tags: [Catalog]
      operationId: reactivateItem
      responses:
        "200":
          description: Catalog item reactivated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CatalogItem" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /organizations/{organizationId}/establishments/{establishmentId}/warehouses:
    parameters:
      - $ref: "#/components/parameters/OrganizationId"
      - $ref: "#/components/parameters/EstablishmentId"
    get:
      tags: [Inventory]
      operationId: listWarehouses
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
        - name: active
          in: query
          schema: { type: boolean }
      responses:
        "200":
          description: Establishment warehouses
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WarehousePage" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [Inventory]
      operationId: createWarehouse
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateWarehouseRequest" }
      responses:
        "201":
          description: Warehouse created
          content:
            application/json:
